site_name: LIQ OS
site_description: LifestyleIQ Operating System specifications
repo_url: https://github.com/driley63/LIQ-OS
repo_name: driley63/LIQ-OS
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: light green
    - scheme: slate
      primary: teal
      accent: deep purple
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - search
  - mermaid2
nav:
  - Home: index.md
  - Core:
      - Overview: core/README.md
      - Specification: core/SPEC.md
      - Constitution: core/constitution.md
      - Philosophy: core/philosophy.md
      - Governance: core/governance.md
      - Versioning: core/versioning.md
      - Quality Standards: core/quality-standards.md
      - Non-Negotiables: core/non-negotiables.md
      - Roadmap: core/roadmap.md
  - Specifications:
      - Overview: specs/README.md
      - Brand Identity:
          - Overview: specs/01-brand/README.md
          - Specification: specs/01-brand/SPEC.md
          - Brand Story: specs/01-brand/brand-story.md
          - Positioning: specs/01-brand/positioning.md
          - Logo System: specs/01-brand/logo-system.md
          - Logo Construction: specs/01-brand/logo-construction.md
          - Logo Usage: specs/01-brand/logo-usage.md
          - Color System: specs/01-brand/color-system.md
          - Typography: specs/01-brand/typography.md
          - Design Tokens: specs/01-brand/design-tokens.md
          - Iconography: specs/01-brand/iconography.md
          - Accessibility: specs/01-brand/accessibility.md
          - Brand Governance: specs/01-brand/brand-governance.md
          - Asset Production: specs/01-brand/asset-production.md
          - Examples:
              - CSS Tokens: specs/01-brand/examples/css-tokens.md
              - Flutter Theme: specs/01-brand/examples/flutter-theme-snippet.md
              - Logo Misuse: specs/01-brand/examples/logo-misuse.md
              - Type Scale: specs/01-brand/examples/type-scale.md
      - Design Language:
          - Overview: specs/02-design/README.md
          - Specification: specs/02-design/SPEC.md
          - Token Alignment Review: specs/02-design/token-alignment.md
          - Spacing System: specs/02-design/spacing-system.md
          - Layout Grid: specs/02-design/layout-grid.md
          - Radius and Elevation: specs/02-design/radius-and-elevation.md
          - Component Taxonomy: specs/02-design/component-taxonomy.md
          - Buttons: specs/02-design/buttons.md
          - Inputs: specs/02-design/inputs.md
          - Cards: specs/02-design/cards.md
          - Charts: specs/02-design/charts.md
          - Motion: specs/02-design/motion.md
          - Accessibility: specs/02-design/accessibility.md
          - Empty, Error, Loading: specs/02-design/empty-error-loading-states.md
          - Iconography: specs/02-design/iconography.md
      - Product Experience:
          - Overview: specs/03-product/README.md
          - Specification: specs/03-product/SPEC.md
      - Engineering:
          - Overview: specs/04-engineering/README.md
          - Specification: specs/04-engineering/SPEC.md
      - AI:
          - Overview: specs/05-ai/README.md
          - Specification: specs/05-ai/SPEC.md
  - ADRs:
      - Overview: adr/README.md
      - ADR-0001: adr/0001-adopt-lifestyleiq-name.md
      - ADR-0002: adr/0002-establish-brand-philosophy.md
      - ADR-0003: adr/0003-reserve-purple-for-ai.md
      - ADR-0004: adr/0004-adopt-green-teal-gradient.md
      - ADR-0005: adr/0005-adopt-liq-os-model.md
      - ADR-0006: adr/0006-use-markdown-source.md
      - ADR-0007: adr/0007-adopt-inter-typeface.md
      - ADR-0008: adr/0008-adopt-mkdocs.md
      - ADR-0009: adr/0009-adopt-docs-canonical-publishing.md
  - RFCs:
      - Overview: rfc/README.md
  - Playbook:
      - Overview: playbook/README.md
  - Releases:
      - Overview: releases/README.md
      - v1.0.0: releases/v1.0.0/README.md
      - v1.0.1: releases/v1.0.1/README.md
      - v1.1.0: releases/v1.1.0/README.md
      - v1.2.0: releases/v1.2.0/README.md

name: Validate Repository

on:
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "amplify.yml"
      - ".github/workflows/validate-markdown.yml"
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check repository layout
        run: |
          test -f README.md
          test -f CHANGELOG.md
          test -f CONTRIBUTING.md
          test -f docs/index.md
          test -f docs/core/SPEC.md
          test -f docs/specs/01-brand/SPEC.md
          test -f docs/adr/0001-adopt-lifestyleiq-name.md
          test -f docs/adr/0009-adopt-docs-canonical-publishing.md
          test -f docs/releases/v1.0.1/release-notes.md
          test ! -d core
          test ! -d specs
          test ! -d adr
          test ! -d rfc
          test ! -d playbook
          test ! -d releases

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

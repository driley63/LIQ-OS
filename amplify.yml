version: 1

env:
  variables:
    PIP_CACHE_DIR: .pip-cache

frontend:
  phases:
    preBuild:
      commands:
        - python3 --version
        - python3 -m pip install --user --upgrade pip
        - python3 -m pip install --user --cache-dir "$PIP_CACHE_DIR" -r requirements-docs.txt
    build:
      commands:
        - python3 -m mkdocs build --strict
  artifacts:
    baseDirectory: site
    files:
      - "**/*"
  cache:
    paths:
      - .pip-cache/**/*
